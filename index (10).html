.btn{font:inherit;font-size:1.05rem;background:var(--gold);color:#3a2410;border:3px solid #000;box-shadow:0 4px 0 #6b4a08;padding:8px 14px;cursor:pointer;margin:4px}

.opt{margin:8px 0;text-align:center}.opt b{display:block;margin-bottom:4px}
.room{position:relative;height:430px;background:linear-gradient(#6b3d1a 0 62%,#3d2410 62%);border:4px solid #000;overflow:hidden}
.room .curtain{position:absolute;top:0;left:0;right:0;height:60px;background:repeating-linear-gradient(90deg,#9b1c1c 0 28px,#7a1414 28px 56px);border-bottom:6px solid var(--gold)}
.desk{z-index:2;position:absolute;left:14px;bottom:58px;width:62%;height:90px;background:var(--wood);border:4px solid #000;border-bottom-width:10px}
.me{z-index:1;position:absolute;left:56px;bottom:118px}.th{padding:2px;background:#fff7e0;border:3px solid #000;cursor:pointer;margin:2px}.th.on{outline:3px solid var(--red)}.pedestal{background:#e9d3a6;border:4px solid #000;padding:10px 24px 0;box-shadow:inset 0 -12px 0 #b98a4a}
.pencil{z-index:3;position:absolute;left:214px;bottom:150px;width:8px;height:44px;background:#f2c200;border:2px solid #000;transform-origin:bottom center;animation:wr .5s infinite alternate steps(3)}
@keyframes wr{from{transform:rotate(25deg) translateX(0)}to{transform:rotate(38deg) translateX(10px)}}
.act{position:absolute;left:14px;bottom:8px}
.envb{position:absolute;top:6px;right:8px;font-size:1.9rem;background:none;border:0;cursor:pointer;z-index:5;line-height:1}.envb:active{transform:scale(.9)}
.envm{position:absolute;top:46px;right:8px;z-index:6;background:#fff7e0;border:3px solid #000;padding:6px}.envm[hidden]{display:none}
.fold{display:inline-block;width:46%;min-width:130px;margin:6px 1%;padding:12px 6px;background:#fff7e0;border:3px solid #000;cursor:pointer;font:inherit;color:#3a2410;text-align:center;vertical-align:top}.fold:hover{background:#ffeab0}.fold b{display:block;font-size:2rem}
.ttl{width:100%;font-family:'Gaegu','Jua',sans-serif;font-size:1.3rem;text-align:center;border:0;border-bottom:2px dashed #888;margin:8px 0}
.mail{position:absolute;right:16px;bottom:8px;text-align:center}
.paper{background:var(--paper);color:#222;border:3px solid #000;padding:14px;font-family:'Gaegu','Jua',sans-serif;font-size:1.3rem}
.paper textarea{background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);border:0;line-height:34px;min-height:340px;resize:vertical;font-family:'Gaegu','Jua',sans-serif;font-size:1.3rem;padding:0 4px}
.paper .read{white-space:pre-wrap;line-height:34px;background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);min-height:200px}
.topic{text-align:center;border-bottom:3px double #888;padding-bottom:6px}.nick{text-align:right;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff;color:#222}
th,td{border:1px solid #888;padding:4px;vertical-align:top}.tw{overflow-x:auto}
.msg{text-align:center;min-height:1.4em;color:var(--red)}
.tag{display:inline-block;padding:1px 6px;border:2px solid #000;background:var(--gold);color:#222}
.intro{background:#f7edd3 repeating-linear-gradient(transparent 0 43px,#e2d1a6 43px 44px);border:4px solid #000;box-shadow:0 0 0 4px var(--gold2);padding:22px 18px 26px;margin:10px 0;color:#2f2f2f;min-height:600px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

.intro h1 span{display:block;width:fit-content;clip-path:inset(-10% 100% -10% 0);animation:wipe .9s steps(14,end) forwards}
.intro h1 span:nth-child(1){animation-delay:.3s}.intro h1 span:nth-child(2){margin-left:.35em;animation-delay:1.3s}.intro h1 span:nth-child(3){margin-left:.08em;animation-delay:2.3s}.intro h1 span:nth-child(4){margin-left:.7em;animation-delay:3.3s}
@keyframes wipe{to{clip-path:inset(-10% -5% -10% 0)}}
.intro .join{align-self:center;font-family:'Jua','Apple SD Gothic Neo',sans-serif;font-size:1.15rem;background:#3aa64a;color:#fff;border:3px solid #1f6b2b;border-radius:30px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #1f6b2b;margin-top:24px;opacity:0;animation:fin .8s 4.4s forwards}
@keyframes fin{to{opacity:1}}
.intro .join:active{transform:translateY(3px);box-shadow:0 1px 0 #1f6b2b}
.arrive{text-align:center;padding:30px 10px}.arrive h2{font-size:1.7rem;animation:pop .6s both}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

@media (prefers-reduced-motion:reduce){.intro h1 span{animation-duration:.01s;animation-delay:0s!important}.intro .join{animation-delay:0s}}

const nowS=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};

function pubL(l){return l&&{id:l.id,cls:l.cls,nick:l.nick,avatar:l.avatar,title:l.title||'',text:l.text,chars:l.chars,status:l.status,savedAt:l.savedAt,sentAt:l.sentAt,partner:l.partner||''}}
function handle(q){
 const D=load(),a=q.action,L=D.letters,R=D.replies;D.archive=D.archive||[];
 const fold=()=>{const m={};D.archive.forEach(r=>{(m[r.rd]=m[r.rd]||{rd:r.rd,topic:r.topic,count:0}).count++});return Object.values(m).sort((x,y)=>y.rd-x.rd)};
 const me=()=>{const l=L[q.id];if(!l||String(l.pin)!==String(q.pin))throw new Error('비밀번호가 맞지 않아요');return l};
 if(a==='login'){const ex=L[q.id];
  if(ex){if(ex.pin!==q.pin)throw new Error('이미 있는 닉네임이에요. 비밀번호를 확인하거나 다른 닉네임을 써요');if(q.name&&!ex.name)ex.name=q.name}
  else L[q.id]={id:q.id,cls:q.cls,nick:q.nick,name:q.name||'',pin:q.pin,avatar:q.avatar,text:'',chars:0,status:'new',partner:''};
  store(D);return{letter:pubL(L[q.id]),topic:D.topic,returning:!!ex,archiveCount:fold().length}}
 if(a==='me'){return{letter:pubL(me()),topic:D.topic,archiveCount:fold().length}}
 if(a==='archive'){me();return{folders:fold()}}
 if(a==='archiveRound'){me();return{items:D.archive.filter(r=>String(r.rd)===String(q.rd))}}
 if(a==='saveAvatar'){me().avatar=q.avatar;store(D);return{ok:1}}
 if(a==='saveLetter'){const l=me();if(l.status==='sent')throw new Error('이미 보낸 글이에요');
  l.title=String(q.title||'').slice(0,40);l.text=String(q.text||'').slice(0,5000);l.chars=l.text.length;l.status=q.status==='sent'?'sent':'draft';l.savedAt=nowS();l.avatar=q.avatar||l.avatar;
  if(l.status==='sent')l.sentAt=l.savedAt;store(D);return{letter:pubL(l)}}
 if(a==='partner'){const m=me();if(!m.partner)return{};const p=L[m.partner],pr=R[m.partner],mr=R[q.id];
  const rp=r=>r&&{text:r.text,status:r.status,sentAt:r.sentAt};
  return{partner:pubL(p),partnerReply:pr&&pr.status==='sent'?rp(pr):null,myReply:rp(mr)}}

  R[q.id]={id:q.id,to:m.partner,nick:m.nick,text:String(q.text||'').slice(0,5000),status:st,savedAt:t,sentAt:st==='sent'?t:''};
  store(D);return{reply:R[q.id]}}

 if(a==='tDelete'){const ids=(q.ids||[]).map(String);ids.forEach(id=>{delete L[id];delete R[id]});
  Object.values(L).forEach(l=>{if(ids.includes(String(l.partner))){l.partner='';l.group=''}});Object.keys(R).forEach(k=>{if(ids.includes(String(R[k].to)))delete R[k]});D.archive=D.archive.filter(r=>!ids.includes(String(r.id)));store(D);return{deleted:ids.length}}
 if(a==='setTopic'){D.topic=String(q.topic||'');store(D);return{ok:1}}

  Object.values(L).forEach(l=>{l.text='';l.chars=0;l.status='new';l.savedAt='';l.sentAt='';l.group='';l.partner='';l.title=''});

 if(a==='tArchive'){return{items:D.archive.map(r=>({rd:r.rd,topic:r.topic,id:r.id,cls:r.cls,nick:r.nick,title:r.title,chars:(r.text||'').length,sentAt:r.sentAt}))}}

  store(D);return{pairs,alone}}

function editor(o){
 const d=o.data||{};let sent=d.status==='sent',locked=sent||(d.status==='draft'&&!!d.text);
 app.innerHTML=`<div class="panel"><div class="paper"><div class="topic"><b>${esc(o.topic||'(주제 없음)')}</b></div>
 ${o.title?`<input id="ti" class="ttl" maxlength="40" placeholder="글 제목을 입력해요">`:''}
 <div class="nick">보내는 사람: ${esc(S.me.nick)}</div>
 <textarea id="t" placeholder="여기에 글을 써요..."></textarea></div>
 <div class="msg" id="m"></div><div class="row">
 <button class="btn" id="sv">저장하기</button><button class="btn" id="ed">수정하기</button>
 <button class="btn red" id="sd">보내기</button><button class="btn" id="bk">돌아가기</button></div></div>`;
 const t=$('#t');t.value=d.text||'';const ti=o.title?$('#ti'):null;if(ti)ti.value=d.title||'';
 const sync=()=>{t.readOnly=locked;if(ti)ti.readOnly=locked;$('#sv').disabled=locked;$('#ed').disabled=!locked||sent;$('#sd').disabled=!locked||sent;
  if(sent)$('#m').textContent='보냈어요! ('+fmt(d.sentAt)+')'};sync();
 const save=async st=>{$('#m').textContent='저장 중...';
  try{await api(o.save,{...auth(),title:ti?ti.value.trim():'',text:t.value,status:st,avatar:S.me.avatar});return true}
  catch(e){$('#m').textContent=e.message;return false}};
 $('#sv').onclick=async()=>{if(ti&&!ti.value.trim()){$('#m').textContent='제목을 입력해 주세요';return}
  if(!t.value.trim()){$('#m').textContent='글을 써 주세요';return}
  if(await save('draft')){locked=true;sync();$('#m').textContent='저장했어요. 보내기 전에 수정할 수 있어요.'}};
 $('#ed').onclick=()=>{locked=false;sync();$('#m').textContent=''};
 let armed=false;
 $('#sd').onclick=async()=>{if(!armed){armed=true;$('#sd').textContent='정말 보내기!';$('#m').textContent='보내면 고칠 수 없어요. 한 번 더 누르면 보내요.';return}
  if(await save('sent')){sent=true;d.sentAt='방금';sync();refresh()}};
 $('#bk').onclick=()=>{go('desk');refresh()}}

async function read(){
 app.innerHTML=`<div class="panel arrive"><div class="env">${mailbox}</div><h2>이번 주 글이 도착했습니다</h2><div class="row"><button class="btn red" id="op">📖 글 읽기</button></div></div>`;

 <div class="paper"><div class="topic">${esc(S.topic)}</div>${p.title?`<div class="ttl" style="border-bottom:2px dashed #888;padding:6px 0">${esc(p.title)}</div>`:''}<div class="read">${esc(p.text)}</div></div>`:'<p class="msg">글을 불러오지 못했어요.</p>'}
 ${r?`<h2>💌 내 글에 답장이 왔어요</h2><p class="msg" style="color:var(--ink)">답장에는 다시 답장할 수 없어요.</p><div class="paper"><div class="read">${esc(r.text)}</div></div>`:''}

async function archive(){
 const head=(t,back)=>`<div class="panel"><div class="row"><button class="btn" id="bk">${back}</button><h2 style="margin:0">${t}</h2></div>`;
 app.innerHTML='<div class="panel"><p class="msg">불러오는 중...</p></div>';
 const showFolders=async()=>{
  let j;try{j=await api('archive',auth())}catch(e){j={folders:[]}}
  app.innerHTML=head('📁 이전 글 모아보기','← 홈으로')+(j.folders.length?`<p class="msg" style="color:var(--ink)">주제 폴더를 눌러 보세요</p><div class="row">${j.folders.map(f=>`<button class="fold" data-rd="${esc(f.rd)}"><b>📁</b>${esc(f.topic)}<br><small>${f.count}편</small></button>`).join('')}</div>`:'<p class="msg" style="color:var(--ink)">아직 보관된 글이 없어요</p>')+'</div>';
  $('#bk').onclick=()=>{go('desk');refresh()};
  app.querySelectorAll('.fold').forEach(b=>b.onclick=()=>showRound(b.dataset.rd,j.folders.find(f=>String(f.rd)===b.dataset.rd)))};
 const showRound=async(rd,f)=>{
  app.innerHTML='<div class="panel"><p class="msg">불러오는 중...</p></div>';
  let j;try{j=await api('archiveRound',{...auth(),rd})}catch(e){j={items:[]}}
  app.innerHTML=head('📁 '+esc(f?f.topic:''),'← 폴더 목록')+`<div class="row" style="align-items:flex-start">${j.items.map((it,i)=>`<button class="fold" data-i="${i}"><b>📝</b>${esc(it.title||'(제목 없음)')}<br><small>${esc(it.nick)} · ${esc(it.cls)}반</small></button>`).join('')||'<p class="msg" style="color:var(--ink)">글이 없어요</p>'}</div></div>`;
  $('#bk').onclick=showFolders;
  app.querySelectorAll('.fold').forEach(b=>b.onclick=()=>showLetter(j.items[+b.dataset.i],()=>showRound(rd,f)))};
 const showLetter=(it,back)=>{
  app.innerHTML=head('📝 글 보기','← 목록')+`<div class="paper"><div class="topic">${esc(it.topic||'')}</div><div class="ttl" style="border-bottom:2px dashed #888;padding:6px 0">${esc(it.title||'(제목 없음)')}</div><div class="nick">보낸 사람: ${esc(it.nick)} (${esc(it.cls)}반)</div><div class="read">${esc(it.text)}</div></div>${it.replyText?`<h2>💌 ${esc(it.replyNick)}의 답장</h2><div class="paper"><div class="read">${esc(it.replyText)}</div></div>`:''}</div>`;
  $('#bk').onclick=back};
 showFolders()}

function accounts(list){
 app.innerHTML=`<div class="panel"><h2>학생 계정 관리</h2>
 <p class="msg" style="color:var(--ink)">지우고 싶은 계정(시험용 등)을 체크하고 '선택 삭제'를 누르세요. 그 학생의 글과 답장도 함께 지워져요.</p>
 <div class="row"><button class="btn" id="sa">전체 선택</button><button class="btn red" id="sd">선택 삭제</button><button class="btn" id="bk2">← 교사 페이지</button></div>
 <div class="msg" id="m"></div>
 <div class="tw"><table><tr><th></th><th>반</th><th>이름</th><th>닉네임</th><th>상태</th><th>글자수</th></tr>

async function teacher(){

 let j;try{j=await api('tAll',teach())}catch(e){S.flash=e.message;return go('login')}
 const ls_=j.letters,rs=j.replies;

 const assigned=sent.some(l=>l.partner);
 app.innerHTML=`<div class="panel"><h2>교사 페이지</h2>
 <b>이번 주 주제</b><div class="row"><input id="tp" value="${esc(j.topic)}" style="flex:1"></div>

 <h2>제출된 글 (${sent.length}/${ls_.length}명)</h2>

 <div class="msg" id="m">${assigned?'이미 배정되었습니다. 다시 누르면 새로 배정됩니다.':'표에서 학생마다 짧은 글/긴 글 그룹을 고른 뒤(자동 나누기 버튼도 있어요) 배정하기를 누르면, 같은 그룹 안에서 반 상관없이 무작위로 짝이 정해집니다.'}</div>
 <p style="text-align:center;font-size:.85rem">전체 기록은 연결된 구글 시트의 letters / replies 탭에서도 볼 수 있어요.</p>

 app.querySelectorAll('.fd').forEach(b=>{let c=false;b.onclick=async()=>{if(!c){c=true;b.textContent='정말?';setTimeout(()=>{c=false;b.textContent='삭제'},3000);return}

init();
